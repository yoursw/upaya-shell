[workspace]
members = [
    "upaya-core",
    "upaya-tui",
    "upaya-plugin",
    "demo"
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Your SW <admin@kusala.tech>"]
license = "AGPL-3.0"
repository = "https://github.com/yoursw/upaya-shell"
description = "A modular TUI toolbox with plugin support"

[workspace.dependencies]
# Core error handling
thiserror = "1.0.56"
anyhow = "1.0.79"

# TUI framework
ratatui = "0.24.0"
crossterm = "0.27.0"

# Async runtime
tokio = { version = "1.36.0", features = ["rt-multi-thread", "macros", "fs", "io-util"] }

# Serialization
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.114"

# WASM runtime
wasmtime = "20.0.1"

# Git operations
git2 = "0.18.3"

# HTTP client
reqwest = { version = "0.11.24", features = ["json"] }

# Logging
tracing = "0.1.40"
tracing-subscriber = "0.3.18"

[workspace.dev-dependencies]
criterion = "0.5"
tarpaulin = "0.18.13"
mockall = "0.12.1"
